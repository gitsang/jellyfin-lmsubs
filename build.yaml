name: "LMSubs"
guid: "9b1f2a44-3c5d-4e6f-8a7b-9c0d1e2f3a4b"
version: "1.4.3.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "gitsang"
overview: "OpenAI-compatible ASR + LLM subtitle generation and translation"
description: >
  Generate subtitles from speech (ASR) and translate them with any
  OpenAI-compatible LLM. Provider presets plus configurable Base URL /
  API Key / Model for both stages. Works like OpenSubtitles: search and
  download "LM Subtitles" in the Edit Subtitles dialog; the server
  generates the full subtitle, which is then saved and registered by
  Jellyfin. Completed results are cached. No web modification.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.LmSubs.dll"
changelog: |
  ## 1.4.3.0
  - Task list decoupled from subtitle entries: rows are pipeline units —
    one ASR per item, one Translate per language (kind: asr|translate).
    No bilingual/translated wording; subtitle downloads are just triggers.
  - DELETE /LmSubs/Tasks/{itemId}?lang= takes source or a language; a
    translate delete clears both cache representations of that language.
  ## 1.4.2.0
  - Fixed search entry names: LM Subtitles - Source / Translate / Bilingual
    (target language stays in the description).
  - Completed state shows "(Completed)" on the model line instead of a
    separate "Ready (cached)" line.
  - Tasks list: one ASR row + one Translate row per language (translated
    and bilingual merged; legacy and bi- caches deduplicated).
  ## 1.4.1.1
  - Fix "Ready (cached)" not shown for legacy caches in search results
    (cache lookup used the ISO code instead of the language slug).
  ## 1.4.1.0
  - Translated and bilingual entries now share ONE translation job per
    language: translation runs once, producing paired source+translation
    cues; the translated entry renders translation-only from the same
    data. No double LLM cost. Deleting either cache removes both.
  - Legacy pre-1.4.1 translated.<lang>.srt caches still serve correctly.
  ## 1.4.0.1
  - Cache hit on download returns immediately: no ASR session restart,
    no waiting (fixes cached source download re-running transcription).
  ## 1.4.0.0
  - Search now lists three entries: Source (transcription only),
    Translated, and Bilingual — all sharing one ASR pass. Translation
    runs only when a translated/bilingual entry is downloaded.
  - Removed "Include translation" and "Subtitle style" settings; the
    downloaded entry decides the mode. Translated entries are always
    translation-only; bilingual entries are two-line source+translation.
  - Source entry uses the video's metadata language for its track code.
  - REST Generate takes mode (source|translated|bilingual) instead of
    translate; Tasks/Subtitles endpoints understand bilingual cache keys.
  ## 1.3.8.0
  - Tasks list on the settings page: running and completed generations
    (including cache-only entries after a restart), with Stop / Delete.
    Delete removes the plugin cache only; downloaded subtitles are kept.
  - New REST: GET /LmSubs/Tasks, DELETE /LmSubs/Tasks/{itemId}?lang=.
  ## 1.3.7.0
  - Silence-aware timing for timestamp-less ASR: ffmpeg silencedetect on
    each chunk locates real speech ranges; sentences are distributed over
    the speech timeline (pauses/intros skipped) and snapped to nearby
    silence edges. Falls back to proportional timing when unavailable.
  - New Advanced settings: silence noise floor (default -35 dB) and
    minimum silence length (default 0.45 s).
  ## 1.3.6.0
  - Sentence-first cue splitting: text is cut at sentence-ending
    punctuation (。！？!?…, latin . before capitals, abbreviation-aware)
    before any length-based split; over-length sentences break at clause
    punctuation (，、；：,;:) before word/character fallbacks. Timing stays
    proportional to characters within the ASR segment.
  ## 1.3.5.0
  - New Context size setting: estimated input-token budget per translate
    request (default 6000, 0 = unlimited). Batches are packed under the
    budget; context pairs are trimmed to fit.
  - Provider context-overflow 400s (max_seq_len / context_length / token
    exceeded) now split the batch in half and retry instead of failing
    the whole job; a single oversized line retries without context.
  ## 1.3.4.0
  - Remove the dead "ASR concurrency" setting (ASR has been sequential
    since the shared-session rewrite).
  - Debounce duplicate download clicks: while a download already waits on
    a running job, another click fails fast instead of saving a second
    (duplicate) subtitle track when generation completes.
  - Plugin-only Log level setting (Advanced): empty follows the server;
    Debug logs every ASR chunk and translation batch, tagged [Debug] when
    the server level would otherwise hide it.
  ## 1.3.3.0
  - ASR is now shared across target languages: one transcription pass per
    item; a second language reuses the transcript and its progress, paying
    only for translation. Translations for different languages run in parallel.
  ## 1.3.2.1
  - Fix "error trying to start process 'ffmpeg'": use Jellyfin's resolved
    encoder path (IMediaEncoder.EncoderPath / ProbePath) instead of bare
    "ffmpeg", which is not on PATH in the official container.
  ## 1.3.2.0
  - Search entry renamed to "LM Subtitles"; description shows ASR model,
    translate model and target language on separate lines.
  - Target language now comes from the language picked in the Edit Subtitles
    search dialog (Target language setting removed).
  - Search again while generating to see live ASR / Translate percentages
    in the entry description; "Ready (cached)" when finished.
  - AI Translated flag only set when translation is enabled.
  ## 1.3.1.0
  - Target Jellyfin 10.11 (.NET 9): ILibraryManager.GetItemList returns
    IReadOnlyList in 10.11, the net8/10.10 build threw MissingMethodException
    on every search. Rebuilt against Jellyfin.Controller 10.11.5.
  ## 1.3.0.2
  - Fix "no results" in Edit Subtitles search: provider was registered under
    its concrete type, but SubtitleManager resolves IEnumerable<ISubtitleProvider>.
  ## 1.3.0.1
  - Settings page: Advanced section back to a single column; clearer label
    for the translation toggle (transcription-only mode).
  ## 1.3.0.0
  - OpenSubtitles-style flow: generate via Edit Subtitles -> search -> download;
    finished subtitle is saved/registered by Jellyfin itself.
  - Full sequential generation only; removed injected tracks, playback-event
    triggers and position-first/live logic.
  - REST Generate/Status/Cancel/Translate/Subtitles/Test retained.
  ## 1.2.0.0
  - Two-column settings page (single column on narrow screens).
  - Provider dropdowns for ASR and translation with default base URLs;
    empty Base URL falls back to the selected provider's preset.
  - Entire project in English (UI, track titles, docs, messages).
