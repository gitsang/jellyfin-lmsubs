overview: "OpenAI-compatible ASR + LLM subtitle generation and translation"
description: >
  Generate subtitles from speech (ASR) and translate them with any
  OpenAI-compatible LLM. Provider presets plus configurable Base URL /
  API Key / Model for both stages. Adds two native subtitle tracks to
  every video: "LM Subtitles" fills itself from the current playback
  position using cache when possible, "LM Subtitles (Live)" always
  re-transcribes and overwrites. No web modification.
