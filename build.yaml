changelog: |
  ## 1.1.1.0
  - Fix config page: buttons did nothing on jellyfin 10.9+ because inline
    scripts are no longer executed; moved logic to an ES-module controller
    loaded via data-controller.
  ## 1.1.0.0
  - Native subtitle tracks "LM 字幕" / "LM 字幕（实时）" in every client's subtitle
    selector — selecting a track starts ASR + translation at the current position.
  - Position-first chunk pipeline with on-disk cache; completed videos never call
    the API again. Live track always re-transcribes and overwrites.
  - Removed the web-injection approach entirely.
  ## 1.0.0.0
  - Initial release: full-video ASR generation, LLM translation with rolling
    context, realtime window transcription, config page with connectivity test.
