name: "LMSubs"
guid: "9b1f2a44-3c5d-4e6f-8a7b-9c0d1e2f3a4b"
version: "1.3.2.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "gitsang"
overview: "OpenAI-compatible ASR + LLM subtitle generation and translation"
description: >
  Generate subtitles from speech (ASR) and translate them with any
  OpenAI-compatible LLM. Provider presets plus configurable Base URL /
  API Key / Model for both stages. Works like OpenSubtitles: search and
  download "LM Subtitles" in the Edit Subtitles dialog; the server
  generates the full subtitle, which is then saved and registered by
  Jellyfin. Completed results are cached. No web modification.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.LmSubs.dll"
changelog: |
  ## 1.3.2.0
  - Search entry renamed to "LM Subtitles"; description shows ASR model,
    translate model and target language on separate lines.
  - Target language now comes from the language picked in the Edit Subtitles
    search dialog (Target language setting removed).
  - Search again while generating to see live ASR / Translate percentages
    in the entry description; "Ready (cached)" when finished.
  - AI Translated flag only set when translation is enabled.
  ## 1.3.1.0
  - Target Jellyfin 10.11 (.NET 9): ILibraryManager.GetItemList returns
    IReadOnlyList in 10.11, the net8/10.10 build threw MissingMethodException
    on every search. Rebuilt against Jellyfin.Controller 10.11.5.
  ## 1.3.0.2
  - Fix "no results" in Edit Subtitles search: provider was registered under
    its concrete type, but SubtitleManager resolves IEnumerable<ISubtitleProvider>.
  ## 1.3.0.1
  - Settings page: Advanced section back to a single column; clearer label
    for the translation toggle (transcription-only mode).
  ## 1.3.0.0
  - OpenSubtitles-style flow: generate via Edit Subtitles -> search -> download;
    finished subtitle is saved/registered by Jellyfin itself.
  - Full sequential generation only; removed injected tracks, playback-event
    triggers and position-first/live logic.
  - REST Generate/Status/Cancel/Translate/Subtitles/Test retained.
  ## 1.2.0.0
  - Two-column settings page (single column on narrow screens).
  - Provider dropdowns for ASR and translation with default base URLs;
    empty Base URL falls back to the selected provider's preset.
  - Entire project in English (UI, track titles, docs, messages).
