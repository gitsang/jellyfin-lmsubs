framework: "net8.0"
owner: "gitsang"
overview: "OpenAI-compatible ASR + LLM subtitle generation and translation"
description: >
  Generate subtitles from speech (ASR) and translate them with any
  OpenAI-compatible LLM. Configurable Base URL / API Key / Model for both
  stages. Adds two native subtitle tracks to every video: "LM 字幕" fills
  itself from the current playback position using cache when possible,
  "LM 字幕（实时）" always re-transcribes and overwrites. No web modification.
category: "Metadata"
artifacts:
